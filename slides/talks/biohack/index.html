<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing the Loop · BioHack 2026</title>
<!--
  Closing the Loop Between Knowledge and Discovery: team Zhang et al., Nucleate Pittsburgh BioHack 2026. A live deck: every slide is drawn in the
  browser by its module in slides/. Arrow keys or clicks step, S speaker notes, O overview, F fullscreen,
  T dark/light theme, L laser pointer. Works offline, also opened straight from disk.
-->
<link rel="stylesheet" href="../../vendor/reveal/reveal.css">
<link rel="stylesheet" href="../../web/deck.css">
</head>
<body>
<div class="reveal"><div class="slides"></div></div>

<!-- the runtime -->
<script src="../../vendor/reveal/reveal.js"></script>
<script src="../../vendor/reveal/notes.js"></script>
<script src="../../vendor/manim-web/manim-web.iife.js"></script>
<script src="../../web/deck.js"></script>
<script src="../../web/manim.js"></script>
<script src="../../web/plots.js"></script>

<!-- the slides, in order. Deck.section(n) puts the slides after it in section n of the footer; null = none -->
<script>Deck.section(null)</script>
<script src="slides/title.js"></script>
<script src="slides/outline.js"></script>
<script>Deck.section(1)</script>
<script src="slides/loop.js"></script>
<!-- blank.js sets each placeholder slide's section itself -->
<script src="slides/blank.js"></script>
<!-- the two benchmark templates, slotted in ahead of the Results placeholder -->
<script>Deck.section(3)</script>
<script src="slides/benchmarks.js"></script>
<script>Deck.section(null)</script>

<script>Deck.start({ title: 'Closing the Loop · BioHack 2026' });</script>
</body>
</html>
